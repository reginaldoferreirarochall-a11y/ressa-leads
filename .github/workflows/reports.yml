name: RESSA Relatórios

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ressa-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependência do Neon
        run: npm install --no-save @neondatabase/serverless
      - name: Gerar relatórios
        run: node reports.js
      - name: Publicar relatórios
        run: |
          git config user.name "RESSA Relatórios"
          git config user.email "actions@github.com"
          git add docs/reports.html
          git commit -m "Relatórios atualizados" || echo "sem mudanças"
          git push
