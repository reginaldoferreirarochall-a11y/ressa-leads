name: RESSA Exportar CSV

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ressa-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependência do Neon
        run: npm install --no-save @neondatabase/serverless
      - name: Gerar CSV da base
        run: node export.js
      - name: Publicar CSV
        run: |
          git config user.name "RESSA Export"
          git config user.email "actions@github.com"
          git add docs/leads.csv
          git commit -m "CSV da base atualizado" || echo "sem mudanças"
          git push
